<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Matches the app's actual brand/accent tokens (globals.css:
       --color-brand is lime, --color-accent is cyan), not an
       older colour pass this icon was never updated to follow. */
    .ring-a { stop-color: #4d7c0f; }
    .ring-b { stop-color: #0e7490; }
    @media (prefers-color-scheme: dark) {
      .ring-a { stop-color: #bef264; }
      .ring-b { stop-color: #67e8f9; }
    }
  </style>
  <defs>
    <linearGradient id="ring" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="ring-a" />
      <stop offset="50%" class="ring-b" />
      <stop offset="100%" class="ring-a" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#ring)" stroke-width="5" />
</svg>
