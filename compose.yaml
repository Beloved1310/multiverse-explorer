services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      RICK_AND_MORTY_GRAPHQL_ENDPOINT: ${RICK_AND_MORTY_GRAPHQL_ENDPOINT:-https://rickandmortyapi.com/graphql}
      DATABASE_URL: postgresql://${POSTGRES_USER:-multiverse}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-multiverse_explorer}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-replace-before-production-123456}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-multiverse}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-multiverse_explorer}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multiverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-multiverse_explorer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
